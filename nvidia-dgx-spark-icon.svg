<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="nvidiaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#76B900"/>
      <stop offset="100%" style="stop-color:#5A8F00"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="12" fill="#1a1a1a"/>
  <!-- GPU chip representation -->
  <rect x="20" y="25" width="60" height="50" rx="4" fill="url(#nvidiaGreen)"/>
  <!-- Chip grid pattern -->
  <g fill="#1a1a1a" opacity="0.3">
    <rect x="25" y="30" width="10" height="10" rx="1"/>
    <rect x="38" y="30" width="10" height="10" rx="1"/>
    <rect x="51" y="30" width="10" height="10" rx="1"/>
    <rect x="64" y="30" width="10" height="10" rx="1"/>
    <rect x="25" y="43" width="10" height="10" rx="1"/>
    <rect x="38" y="43" width="10" height="10" rx="1"/>
    <rect x="51" y="43" width="10" height="10" rx="1"/>
    <rect x="64" y="43" width="10" height="10" rx="1"/>
    <rect x="25" y="56" width="10" height="10" rx="1"/>
    <rect x="38" y="56" width="10" height="10" rx="1"/>
    <rect x="51" y="56" width="10" height="10" rx="1"/>
    <rect x="64" y="56" width="10" height="10" rx="1"/>
  </g>
  <!-- Connection pins -->
  <g fill="#76B900">
    <rect x="25" y="18" width="4" height="7" rx="1"/>
    <rect x="35" y="18" width="4" height="7" rx="1"/>
    <rect x="45" y="18" width="4" height="7" rx="1"/>
    <rect x="55" y="18" width="4" height="7" rx="1"/>
    <rect x="65" y="18" width="4" height="7" rx="1"/>
    <rect x="25" y="75" width="4" height="7" rx="1"/>
    <rect x="35" y="75" width="4" height="7" rx="1"/>
    <rect x="45" y="75" width="4" height="7" rx="1"/>
    <rect x="55" y="75" width="4" height="7" rx="1"/>
    <rect x="65" y="75" width="4" height="7" rx="1"/>
  </g>
  <!-- Spark effect -->
  <g fill="#FFD700" opacity="0.9">
    <polygon points="85,15 82,22 78,18 80,25 73,22 78,27 72,30 80,29 77,36 82,30 88,35 85,28 92,30 86,25 92,20 85,22"/>
  </g>
</svg>